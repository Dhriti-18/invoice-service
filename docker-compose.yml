services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  mock-psp:
    build: .
    image: invoice-service:latest
    command: ["mock-psp"]
    environment:
      PORT: "9090"
    ports:
      - "9090:9090"

  api:
    build: .
    image: invoice-service:latest
    command: ["invoice-service"]
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://invoice:invoice@postgres:5432/invoice_service
      MOCK_PSP_URL: http://mock-psp:9090
      WEBHOOK_SIGNING_SECRET: change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-psp:
        condition: service_started

volumes:
  pgdata:
